name: deploy-cloudflare

# Builds the OpenNext worker and deploys it to Cloudflare Workers on every push to main.
# Runtime secrets (SESSION_SECRET, CRON_SECRET, GITHUB_*, UPSTASH_*, ...) live in Cloudflare, not here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits, so deploys never race each other.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      # Only this step sees the Cloudflare credentials. Everything above runs without them.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cf:deploy
